name: verify

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      ENV: development
      DEBUG: "False"
      DATABASE_URL: sqlite+aiosqlite:///./ci-app.db
      DATA_DIR: ./ci-data
      LOGS_DIR: ./ci-logs
      BASE_DIR: .
      JWT_SECRET_KEY: ci-only-secret-not-for-production-0123456789abcdef
      SETTINGS_ENCRYPTION_KEY: ci-only-independent-encryption-key-0123456789abcdef
      LLM_API_KEY: ""
      VISION_API_KEY: ""
      EMBEDDING_API_KEY: ""
      WEATHER_API_KEY: ""
      RAGPROJECT_API_KEY: ""
      SILICONFLOW_API_KEY: ""
      OPENAI_API_KEY: ""
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # requirements.txt is the maintainer-facing manifest. requirements.lock is a
      # single-platform (Windows / CPython 3.12) resolution and is deliberately not
      # used here; CI resolves the maintainer-facing manifest on Linux.
      - run: python -m pip install -r requirements.txt
      - run: python tools/run_agri_checks.py tests --junitxml=../scratch/ci-backend-tests.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
